# OP-32's corpus test: every journal (an older build's file) any test imports is collected by the
# `JournalCorpus` extension, and `JournalCorpusTest` — ordered last — round-trips each one through the graph.
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
