<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConstructIt</title>
    <style>
        html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #222; }
        #app { display: flex; flex-direction: column; height: 100%; }
        #topbar { display: flex; align-items: baseline; gap: 16px; padding: 6px 12px; border-bottom: 1px solid #ddd; background: #fafafa; }
        #topbar .brand { font-weight: 600; color: #1f77b4; }
        #edit-actions button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
        #edit-actions button:hover:enabled { background: #f0f0f0; }
        #edit-actions button:disabled { color: #bbb; border-color: #e5e5e5; cursor: default; }
        #status { font-size: 12px; color: #888; }
        #main { display: flex; flex: 1; min-height: 0; }

        /* left palette (scales with the tool registry) */
        #palette { width: 150px; overflow: auto; border-right: 1px solid #ddd; background: #fafafa; padding: 6px; }
        #palette .cat { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #999; margin: 10px 4px 4px; }
        #palette .tool { display: block; width: 100%; text-align: left; border: 1px solid #ccc; background: #fff;
            border-radius: 6px; padding: 5px 8px; margin-bottom: 4px; cursor: pointer; font-size: 12px; }
        #palette .tool:hover { background: #f0f0f0; }
        #palette .tool.active { background: #1f77b4; color: #fff; border-color: #1f77b4; }

        #canvas-area { flex: 1; position: relative; background: #fff; }
        #canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

        /* right panel */
        #panel { width: 250px; border-left: 1px solid #ddd; overflow: auto; background: #fafafa; padding: 10px; }
        #panel h3 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: .05em; }
        #panel h3:first-child { margin-top: 0; }
        #params-form { display: flex; gap: 4px; margin-bottom: 6px; }
        #params-form input { width: 44px; } #params-form #p-name { width: 52px; }
        #params-form select, #params-form input, #params-form button { font-size: 12px; padding: 2px 4px; }
        .prow { display: flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .prow:hover { background: #eef4fb; }
        .prow.active { background: #e2eefb; outline: 1px solid #1f77b4; }
        .prow .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .prow .pval { width: 46px; }
        .prow .pval:disabled { background: #eee; color: #888; }
        .prow .punit { width: 18px; color: #999; }
        .prow .pbind { width: 44px; font-size: 11px; }
        .mrow { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 4px; color: #333; border-radius: 4px; cursor: pointer; }
        .mrow:hover { background: #eef4fb; }
        .mrow.active { background: #e2eefb; outline: 1px solid #1f77b4; }
        .mrow .mval { color: #2ca02c; }
        #file-actions { display: flex; gap: 4px; }
        #file-actions button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
        #file-actions button:hover { background: #f0f0f0; }
        #file-note { font-size: 11px; color: #999; padding: 4px 4px 0; }
        #file-note.err { color: #d62728; }
        .frow { display: flex; align-items: center; gap: 4px; padding: 3px 4px; font-size: 12px; }
        .frow .flabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .frow .fval { width: 58px; }
        .frow .fval:disabled { background: #eee; color: #888; }
        .frow .funit { width: 18px; color: #999; }
        #inspector .selname { font-size: 12px; color: #1f77b4; padding: 0 4px 2px; }
        #inspector .hint { font-size: 11px; color: #999; padding: 0 4px; }
        #tree .item { font-size: 12px; padding: 2px 4px; border-radius: 4px; }
        #tree .item .eid { color: #bbb; float: right; }
    </style>
</head>
<body>
<div id="app">
    <div id="topbar">
        <span class="brand">ConstructIt</span>
        <span id="edit-actions">
            <button id="e-undo" title="Undo (Ctrl+Z)">Undo</button>
            <button id="e-redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">Redo</button>
            <button id="e-delete" title="Delete the selection and everything built on it (Del)">Delete</button>
        </span>
        <span id="status"></span>
    </div>
    <div id="main">
        <nav id="palette"></nav>
        <div id="canvas-area"><canvas id="canvas"></canvas></div>
        <aside id="panel">
            <h3>Drawing</h3>
            <div id="file-actions">
                <button id="f-copy" title="Copy the drawing as a construction script">Copy</button>
                <button id="f-download" title="Download the drawing as a .cit file">Save</button>
                <button id="f-load" title="Load a construction script">Open…</button>
                <input id="f-file" type="file" accept=".cit,.txt" hidden>
            </div>
            <div id="file-note"></div>
            <div id="view-actions">
                <label title="Dim the construction the result is built from (OP-14)">
                    <input id="v-dim" type="checkbox"> Dim construction
                </label>
            </div>
            <div id="wall-options">
                <label title="Which side of the centerline a new wall's thickness sits on (OP-21)">
                    Wall side
                    <select id="v-just">
                        <option value="center">centred</option>
                        <option value="left">left</option>
                        <option value="right">right</option>
                    </select>
                </label>
            </div>
            <h3>Selection</h3>
            <div id="inspector"></div>
            <h3>Parameters</h3>
            <div id="params-form">
                <input id="p-name" placeholder="name" value="r">
                <input id="p-value" type="number" value="20">
                <select id="p-unit"><option value="mm">mm</option><option value="deg">°</option><option value="num">#</option></select>
                <button id="p-add">+</button>
            </div>
            <div id="params-list"></div>
            <h3>Measurements</h3>
            <div id="measure-list"></div>
            <h3>Elements</h3>
            <div id="tree"></div>
        </aside>
    </div>
</div>
<script src="constructit.js"></script>
</body>
</html>
