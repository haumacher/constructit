<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConstructIt</title>
    <style>
        html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #222; }
        #app { display: flex; flex-direction: column; height: 100%; }
        #topbar { display: flex; align-items: baseline; gap: 16px; padding: 6px 12px; border-bottom: 1px solid #ddd; background: #fafafa; }
        #topbar .brand { font-weight: 600; color: #1f77b4; }
        /* the drawing's name: shell state, not part of the file — see DocumentName */
        #f-name { font: inherit; font-size: 13px; width: 14ch; padding: 1px 4px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #444; }
        #f-name:hover { border-color: #ddd; background: #fff; }
        #f-name:focus { border-color: #1f77b4; background: #fff; outline: none; }
        #edit-actions button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
        #edit-actions button:hover:enabled { background: #f0f0f0; }
        #edit-actions button:disabled { color: #bbb; border-color: #e5e5e5; cursor: default; }
        /* one line, always: a wrapping status bar would change the canvas box under the cursor */
        #status { font-size: 12px; color: #888; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #main { display: flex; flex: 1; min-height: 0; }

        /* left palette (scales with the tool registry) */
        #palette { width: 150px; overflow: auto; border-right: 1px solid #ddd; background: #fafafa; padding: 6px; }
        #palette .cat { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #999; margin: 10px 4px 4px; }
        #palette .tool { display: block; width: 100%; text-align: left; border: 1px solid #ccc; background: #fff;
            border-radius: 6px; padding: 5px 8px; margin-bottom: 4px; cursor: pointer; font-size: 12px; }
        #palette .tool:hover { background: #f0f0f0; }
        #palette .tool.active { background: #1f77b4; color: #fff; border-color: #1f77b4; }
        /* the single key that arms a tool, shown on its button so the shortcut is discoverable */
        #palette .tkey { float: right; font-size: 10px; color: #888; border: 1px solid #ddd; border-radius: 3px;
            padding: 0 3px; margin-left: 4px; }
        #palette .tool.active .tkey { color: #fff; border-color: rgba(255,255,255,.6); }
        /* icon buttons: a wrapping grid per category, the glyph inheriting the button's colour so the
           active state costs the icon nothing (see Icons.kt) */
        #palette .icons { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
        #palette .tool.icon { width: 34px; height: 34px; padding: 0; margin: 0; position: relative;
            display: inline-flex; align-items: center; justify-content: center; color: #333; }
        #palette .tool.icon.active { color: #fff; }
        /* the glyph is transparent to the pointer, so a click is always a click on the button */
        #palette .tool.icon svg { display: block; pointer-events: none; }
        /* the shortcut badge in the button's corner — same fact as the text rows', a tenth of the space */
        #palette .tool.icon .tkey { position: absolute; right: 1px; bottom: 0; float: none; border: none;
            margin: 0; padding: 0; font-size: 8px; line-height: 1; color: #999; }
        #palette .tool.icon.active .tkey { color: rgba(255,255,255,.85); }

        #canvas-area { flex: 1; position: relative; background: #fff; }
        /* Both canvases fill the area and are *stacked*: in the 2D view only the first is shown, and in the
           3D view the 2D one becomes the transparent sketch layer over the WebGL one (edit-in-3D slice 1) —
           which is why it must not take the pointer there, since the 3D canvas is what routes the gestures. */
        #canvas, #canvas3, #canvas-preview { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
        /* the sketch layer is above the shaded solids, whatever order the two elements are in */
        #canvas { cursor: crosshair; z-index: 1; }
        #canvas3 { cursor: grab; z-index: 0; }
        #canvas.overlay { pointer-events: none; }
        #canvas[hidden], #canvas3[hidden], #canvas-preview[hidden] { display: none; }
        /* the realistic preview (three.js) is a *third* view — display-only, so it sits above both editing
           canvases and takes the pointer itself (its only gesture is the camera's) */
        #canvas-preview { cursor: grab; z-index: 2; background: #202020; }
        #view-mode button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
        #view-mode button:hover { background: #f0f0f0; }
        #view-mode button.active { background: #1f77b4; color: #fff; border-color: #1f77b4; }
        /* which 2D sketch space the canvas shows (OP-17) — a view indicator, and the way back to the plan */
        #v-space { font: inherit; font-size: 12px; padding: 1px 4px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #444; }

        /* right panel */
        #panel { width: 250px; border-left: 1px solid #ddd; overflow: auto; background: #fafafa; padding: 10px; }
        #panel h3 { margin: 12px 0 6px; font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: .05em; }
        #panel h3:first-child { margin-top: 0; }
        #params-form { display: flex; gap: 4px; margin-bottom: 6px; }
        #params-form input { width: 44px; } #params-form #p-name { width: 52px; }
        #params-form select, #params-form input, #params-form button { font-size: 12px; padding: 2px 4px; }
        /* the function-curve form (session 71): two texts and a domain, so the texts get the room */
        /* closed by default so the panel keeps its height; the summary is the section heading */
        #fc-form { margin: 6px 0; }
        #fc-form > summary { font: 600 11px/1.6 inherit; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
        #fc-form[open] { display: flex; flex-wrap: wrap; gap: 4px; }
        #fc-form > summary { flex: 1 1 100%; }
        #fc-form input { font-size: 12px; padding: 2px 4px; }
        #fc-form #fc-x, #fc-form #fc-y { flex: 1 1 100%; }
        #fc-form #fc-from, #fc-form #fc-to { width: 76px; }
        #fc-form button { font-size: 12px; padding: 2px 6px; }
        /* the section law (OP-26, session 77) rides the same collapsible as the function curve's texts: both
           are formulas over the very same parameter `t`, and sharing one summary line is what keeps the
           panel's idle height exactly where it was (the lists below it may not move — panelPolishInBrowser) */
        #fc-form #sl-text { flex: 1 1 100%; }
        .prow { display: flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .prow:hover { background: #eef4fb; }
        .prow.active { background: #e2eefb; outline: 1px solid #1f77b4; }
        .prow .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        /* the name is an editable field (OP-7); it reads as text until it is hovered or focused */
        .prow input.pname { font: inherit; border: 1px solid transparent; background: transparent; padding: 1px 2px; border-radius: 3px; }
        .prow input.pname:hover, .prow input.pname:focus { border-color: #bcd; background: #fff; }
        /* wide enough for the browser's own up/down arrows on top of the digits */
        .prow .pval { width: 58px; }
        .prow .pval:disabled { background: #eee; color: #888; }
        .prow .punit { width: 18px; color: #999; }
        .prow .pexpr { width: 76px; font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
        .prow .pexpr:disabled { background: #eee; color: #888; }
        .prow .pbind { width: 44px; font-size: 11px; }
        .mrow { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 4px; color: #333; border-radius: 4px; cursor: pointer; }
        .mrow:hover { background: #eef4fb; }
        .mrow.active { background: #e2eefb; outline: 1px solid #1f77b4; }
        .mrow .mval { color: #2ca02c; }
        #file-actions { display: flex; gap: 4px; }
        #file-actions button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
        #file-actions button:hover { background: #f0f0f0; }
        /* the three export buttons: the same row shape as the file actions above them */
        #export-actions { display: flex; gap: 4px; margin-top: 4px; }
        #export-actions button { flex: 1; font-size: 12px; padding: 2px 4px; border: 1px solid #ccc; background: #fff;
            border-radius: 6px; cursor: pointer; }
        #export-actions button:hover { background: #f0f0f0; }
        #tool-options, #wall-options, #view-actions { font-size: 12px; padding: 3px 0; }
        #tool-options input { width: 48px; font-size: 12px; }
        #file-note { font-size: 11px; color: #999; padding: 4px 4px 0; }
        #file-note.err { color: #d62728; }
        .frow { display: flex; align-items: center; gap: 4px; padding: 3px 4px; font-size: 12px; }
        .frow .flabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .frow .fval { width: 58px; }
        .frow .fval:disabled { background: #eee; color: #888; }
        .frow .funit { width: 18px; color: #999; }
        /* the material row (appearance Tier 1): a colour well and the two PBR factors, in one line */
        .frow .fcolor { width: 30px; height: 22px; padding: 0; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
        .frow .fmat { width: 46px; }
        #inspector .selname { font-size: 12px; color: #1f77b4; padding: 0 4px 2px; }
        #inspector .hint { font-size: 11px; color: #999; padding: 0 4px; }
        /* A region of its own, of a FIXED height that scrolls internally: what the inspector shows depends
           on what is selected (nothing, a jamb, a frame, six handle fields), and letting that decide the
           panel's layout moved every list below it under the cursor on every click. */
        #inspector { height: 176px; overflow-y: auto; overflow-x: hidden; border: 1px solid #e6e6e6;
            border-radius: 6px; background: #fff; padding: 4px 2px; }
        /* the element's own name (OP-7): reads as text until hovered or focused, like a parameter's */
        #inspector .fname { flex: 1; min-width: 0; font: inherit; font-size: 12px; border: 1px solid transparent;
            background: transparent; padding: 1px 3px; border-radius: 3px; }
        #inspector .fname:hover, #inspector .fname:focus { border-color: #bcd; background: #fff; }
        /* built from / used by (see Dependencies.kt): the graph, said in names */
        .drow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px; padding: 3px 4px 0; font-size: 11px; }
        .drow .dlabel { color: #999; width: 100%; }
        .drow .dep { border: 1px solid #cfe6cf; background: #f2f9f2; color: #237023; border-radius: 4px;
            padding: 0 4px; cursor: pointer; }
        .drow .dep:hover { background: #e2f3e2; }
        .drow.used .dep { border-color: #e4e5c2; background: #fbfbef; color: #7c7d17; }
        .drow.used .dep:hover { background: #f4f4dc; }
        #sel-actions, #groups-form { display: flex; gap: 4px; margin: 4px 0 6px; }
        #sel-actions button, #groups-form button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff;
            border-radius: 6px; cursor: pointer; }
        #sel-actions button:hover, #groups-form button:hover { background: #f0f0f0; }
        #groups-form input { flex: 1; min-width: 0; font-size: 12px; padding: 2px 4px; }
        .grow { display: flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .grow:hover { background: #eef4fb; }
        .grow .gname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        /* editable in place, exactly as a parameter's name is (OP-16 × OP-7) */
        .grow input.gname { font: inherit; font-size: 12px; border: 1px solid transparent; background: transparent;
            padding: 1px 2px; border-radius: 3px; }
        .grow input.gname:hover, .grow input.gname:focus { border-color: #bcd; background: #fff; }
        .grow .gcount { color: #999; }
        .grow button { border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 11px; line-height: 1; padding: 2px 4px; }
        /* the shared create dialog: group, or tool (OP-16 — one dialog, two defaults) */
        #create-dialog:empty { display: none; }
        #create-dialog { border: 1px solid #cbd8e6; background: #f4f8fd; border-radius: 6px; padding: 6px; margin-bottom: 6px; }
        #create-dialog .cdtitle { font-size: 12px; color: #1f77b4; font-weight: 600; }
        #create-dialog .cdhelp { font-size: 11px; color: #888; margin: 2px 0 4px; }
        #create-dialog .cdrow { display: flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 0; }
        #create-dialog input[type=text] { width: 100%; font-size: 12px; padding: 2px 4px; margin-bottom: 4px; }
        #create-dialog .cdbuttons { display: flex; gap: 4px; margin-top: 4px; }
        #create-dialog button { font-size: 12px; padding: 2px 8px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
        #create-dialog button:hover { background: #eaf1fa; }
        .trow { display: flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .trow:hover { background: #eef4fb; }
        .trow .tname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .trow .tports { color: #999; }
        .trow button { border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 11px; line-height: 1; padding: 2px 4px; }
        #tree .item { font-size: 12px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
        #tree .item:hover { background: #eef4fb; }
        #tree .item.active { background: #e2eefb; outline: 1px solid #1f77b4; }
        #tree .item .eid { color: #bbb; float: right; }
        /* an element that cannot be built right now is present but flagged, never gone (OP-3) */
        #tree .item.invalid { color: #b03a2e; }
        #tree .item.invalid .flag { margin-right: 3px; }
        /* …and one the user has hidden is flagged the same way, in the ghost's own grey (OP-18) */
        #tree .item.gone { color: #8a95a1; }
        #tree .item.gone .flag { margin-right: 3px; }
        #inspector .warn { font-size: 11px; color: #b03a2e; padding: 2px 4px; }
    </style>
</head>
<body>
<div id="app">
    <div id="topbar">
        <span class="brand">ConstructIt</span>
        <input id="f-name" value="drawing" spellcheck="false" autocomplete="off"
               title="The drawing's name. Save writes &lt;name&gt;.cit; it is not stored in the file (the file is the construction).">
        <a id="f-anchor" hidden></a>
        <span id="edit-actions">
            <button id="e-undo" title="Undo (Ctrl+Z)">Undo</button>
            <button id="e-redo" title="Redo (Ctrl+Y / Ctrl+Shift+Z)">Redo</button>
            <button id="e-delete" title="Delete the selection and everything built on it (Del)">Delete</button>
        </span>
        <span id="view-mode">
            <button id="v-2d" class="active" title="The drawing: construct, drag, dimension">2D</button>
            <button id="v-3d" title="The solids, shaded — and the working plane, drawn and edited in place: drag to select and move, Ctrl+drag to orbit, wheel to zoom, Space+drag to pan">3D</button>
            <button id="v-prev" title="Realistic preview: the solids with their materials, lit and tone-mapped — what an exported GLB looks like. Display only; drag to orbit.">Preview</button>
            <select id="v-space" title="Which 2D sketch space the canvas shows and tools draw into: the plan, or a face (Sketch on face)"></select>
        </span>
        <span id="status"></span>
    </div>
    <div id="main">
        <nav id="palette"></nav>
        <div id="canvas-area"><canvas id="canvas"></canvas><canvas id="canvas3" hidden></canvas><canvas id="canvas-preview" hidden></canvas></div>
        <aside id="panel">
            <h3>Drawing</h3>
            <div id="file-actions">
                <button id="f-copy" title="Copy the drawing as a construction script">Copy</button>
                <button id="f-download" title="Save the drawing — back to the same file once it has one">Save</button>
                <button id="f-saveas" title="Save under a new name or in another place">Save as…</button>
                <button id="f-load" title="Load a construction script">Open…</button>
                <input id="f-file" type="file" accept=".cit,.txt" hidden>
                <button id="x-import" title="Import a JT file (ISO 14306) as reference bodies: each body arrives as a frozen mesh with a live placement — drag its point or retype its angle to move it">Import JT…</button>
                <input id="x-import-file" type="file" accept=".jt" hidden>
            </div>
            <div id="export-actions">
                <button id="x-glb" title="Export GLB (glTF 2.0) — for viewing: one node per solid, PBR materials, metres and +Y-up as the spec requires">GLB</button>
                <button id="x-3mf" title="Export 3MF — for printing: the unit is stated (mm) and the mesh is checked watertight before it is written">3MF</button>
                <button id="x-stl" title="Export binary STL — the universal fallback: triangles only, millimetres by convention">STL</button>
                <button id="x-jt" title="Export JT (ISO 14306) — for CAD interchange: Siemens JT, written by the kotlinJT sibling; millimetres declared, one named part per solid">JT</button>
            </div>
            <div id="file-note"></div>
            <div id="view-actions">
                <label title="Dim the construction the result is built from (OP-14)">
                    <input id="v-dim" type="checkbox"> Dim construction
                </label>
                <label title="Draw what you have hidden, as dashed grey ghosts, so you can find it and press Show. A ghost never takes a click from geometry that is really there, and no tool builds on one. A point welded onto another is hidden by the construction and stays hidden.">
                    <input id="v-hidden" type="checkbox"> Show hidden
                </label>
            </div>
            <div id="wall-options">
                <label title="Which side of the centerline a new wall's thickness sits on (OP-21). With Thicken it applies to the NEXT curve you click, so a run can change side part-way.">
                    Wall side
                    <select id="v-just">
                        <option value="center">centred</option>
                        <option value="left">left</option>
                        <option value="right">right</option>
                    </select>
                </label>
            </div>
            <div id="tool-options">
                <label title="How many vertices a polygon or instances an array builds. Structural: it is recorded with the tool, so changing it applies to the next use, not to what is already drawn.">
                    Count
                    <input id="t-count" type="number" min="2" max="512" step="1" value="6">
                </label>
                <button id="t-restamp" title="Re-stamp at the count above the rule the selection names: a pattern member re-counts that pattern (the ring is rebuilt and every gesture riding it re-runs, OP-23), while geometry a replicated gesture built re-counts that gesture — the sides of every copy at once (#18)." disabled>Re-stamp pattern</button>
                <div id="t-pattern" class="hint"></div>
            </div>
            <h3>Selection</h3>
            <div id="inspector"></div>
            <div id="sel-actions">
                <button id="s-hide" title="Hide the selected elements — a recorded step, so it is saved with the drawing and undoes like any other (OP-18). Tick 'Show hidden' to find them again.">Hide</button>
                <button id="s-show" title="Show the selected elements again">Show</button>
            </div>
            <h3>Groups &amp; tools</h3>
            <div id="groups-form">
                <button id="g-add" title="Group the selected elements (OP-16)">Group…</button>
                <button id="g-tool" title="Make a reusable tool out of the selected construction (OP-6)">Make tool…</button>
            </div>
            <div id="create-dialog"></div>
            <div id="groups-list"></div>
            <div id="macros-list"></div>
            <h3>Parameters</h3>
            <div id="params-form">
                <input id="p-name" placeholder="name" value="r">
                <input id="p-value" type="number" value="20">
                <select id="p-unit"><option value="mm">mm</option><option value="deg">°</option><option value="num">#</option></select>
                <button id="p-add">+</button>
            </div>
            <div id="params-list"></div>
            <details id="fc-form" title="Formulas over the parameter t, both reading any value above. A curve piece: x(t), y(t) over a stated domain — an involute of the circle of radius r is x = r*(cos(t)+t*sin(t)), y = r*(sin(t)-t*cos(t)). A swept section's size law: r(t) for a tube, scale(t) for a profile, with t from 0 at the start of the run to 1 at its end.">
                <summary>Formulas over t</summary>
                <input id="fc-x" placeholder="x(t)" value="r * (cos(t) + t * sin(t))">
                <input id="fc-y" placeholder="y(t)" value="r * (sin(t) - t * cos(t))">
                <input id="fc-from" value="0" title="t from — a number, or a formula over the values above">
                <input id="fc-to" value="1.6" title="t to — a number, or a formula over the values above">
                <button id="fc-add">Draw</button>
                <input id="sl-text" placeholder="section law r(t) / scale(t) — e.g. 5mm * (1 - t/2)" title="A swept section's size along its run: one formula over t, which is 0 at the start of the run and 1 at its end. A tube reads it as the radius itself (5mm * (1 - t/2) is a tapered handle, 2mm + 8mm*t*t a horn); a swept profile reads it as a scale about the point it rides on (1 + t/2 is half again as large at the end). Select a swept body to see and change its own law; select nothing to arm the next Tube or Sweep.">
                <button id="sl-set" title="State the size law: on the selected swept body, or armed for the next Tube or Sweep. Blank takes it away.">Apply</button>
            </details>
            <h3>Measurements</h3>
            <div id="measure-list"></div>
            <h3>Elements</h3>
            <div id="tree"></div>
        </aside>
    </div>
</div>
<script src="constructit.js"></script>
</body>
</html>
